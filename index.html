<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GhostCheck — Digital Cleanup</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf2f8;background:#101827}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:12px;align-items:center;font-size:24px;font-weight:800}.logo{background:#b4eee1;color:#10232b;padding:10px;border-radius:14px}.muted{color:#a9bdcc}.layout{display:grid;grid-template-columns:205px 1fr;gap:22px;margin-top:26px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;text-align:left;border-radius:12px;padding:14px;background:transparent;color:#c5d5df}.nav button.active,.nav button:hover{background:#26394b;color:#b4eee1}.main{min-height:650px}.panel{background:#1d2a3d;border:1px solid #304357;border-radius:18px;padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#26394d;border-radius:14px;padding:16px}.number{font-size:29px;font-weight:800;color:#b4eee1}.primary{background:#b4eee1;color:#122c35;border:0;padding:11px 16px;border-radius:11px;font-weight:700}.secondary{background:#31455a;color:#eaf2f8;border:1px solid #4d6376;padding:10px 14px;border-radius:11px}.danger{background:#4b2e3b;color:#ffc8d0;border:1px solid #7b4755;padding:10px 14px;border-radius:11px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #34485a;padding:16px 0}.item:first-of-type{border-top:0}.item p{margin:5px 0 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;background:#314b55;border-radius:99px;font-size:12px;color:#b9eadd}input,select{background:#142235;border:1px solid #4b6072;color:#fff;border-radius:10px;padding:11px;max-width:100%}label{display:block;margin-bottom:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.note{font-size:13px;color:#b4c6d3}.toast{position:fixed;bottom:20px;right:20px;background:#b4eee1;color:#152b35;border-radius:12px;padding:12px 16px;box-shadow:0 8px 30px #0008;display:none}h1{margin:0 0 8px;font-size:28px}h2{margin-top:0}a{color:#b4eee1}@media(max-width:700px){.shell{padding:14px}.layout{display:block}.nav{flex-direction:row;overflow:auto;margin-bottom:18px}.nav button{white-space:nowrap;padding:10px}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.top .muted{display:none}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="logo">👻</span> GhostCheck</div><span class="muted">Find it. Review it. Clean it up.</span></header><div class="layout"><nav class="nav" id="nav"></nav><main class="main" id="content"></main></div><p class="note">Prototype only. All information is sample data stored in this browser. No emails are accessed or scanned.</p></div><div class="toast" id="toast"></div><script>
const defaults={accounts:[{id:1,name:'Old shopping account',source:'Welcome email (sample)',status:'Review'},{id:2,name:'Gaming profile',source:'Old notification (sample)',status:'Review'},{id:3,name:'Travel booking site',source:'Signup email (sample)',status:'Keep'}],subscriptions:[{id:1,name:'Video streaming',amount:12.99,cycle:'Monthly',status:'Review'},{id:2,name:'Cloud storage',amount:2.99,cycle:'Monthly',status:'Keep'},{id:3,name:'Fitness trial',amount:9.99,cycle:'Monthly',status:'Review'}],privacy:{saveLocal:true,reminders:false}};
let data;try{data=JSON.parse(localStorage.getItem('ghostcheck_demo_v1'))||structuredClone(defaults)}catch{data=structuredClone(defaults)}let screen='Dashboard';const screens=['Dashboard','Accounts','Subscriptions','Scan','Settings'];const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('ghostcheck_demo_v1',JSON.stringify(data))}function notify(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function go(s){screen=s;render()}function statusButtons(type,id){return `<div class="row"><button class="secondary" data-action="status" data-type="${type}" data-id="${id}" data-status="Keep">Keep</button><button class="secondary" data-action="status" data-type="${type}" data-id="${id}" data-status="Review">Review</button><button class="danger" data-action="status" data-type="${type}" data-id="${id}" data-status="Closed">${type==='subscriptions'?'Canceled':'Closed'}</button></div>`}function items(type){return data[type].map(x=>`<div class="item"><div><strong>${escapeHTML(x.name)}</strong> <span class="pill">${escapeHTML(x.status)}</span><p class="muted">${type==='accounts'?escapeHTML(x.source):'$'+Number(x.amount).toFixed(2)+' / '+escapeHTML(x.cycle)}</p></div>${statusButtons(type,x.id)}</div>`).join('')||'<p class="muted">Nothing here yet.</p>'}function render(){ $('nav').innerHTML=screens.map(s=>`<button class="${s===screen?'active':''}" data-screen="${s}">${s}</button>`).join('');let html='';if(screen==='Dashboard'){let open=data.accounts.filter(x=>x.status==='Review').length,subs=data.subscriptions.filter(x=>x.status!=='Closed').length;html=`<h1>Your digital cleanup</h1><p class="muted">Review possible old accounts and recurring payments.</p><section class="panel"><div class="stats"><div class="stat"><div class="number">${data.accounts.length}</div><small>Possible accounts</small></div><div class="stat"><div class="number">${subs}</div><small>Subscriptions</small></div><div class="stat"><div class="number">${open+data.subscriptions.filter(x=>x.status==='Review').length}</div><small>Need review</small></div></div></section><section class="panel"><h2>Quick actions</h2><div class="row"><button class="primary" data-screen="Scan">Start a demo scan</button><button class="secondary" data-screen="Accounts">Review accounts</button><button class="secondary" data-screen="Subscriptions">Check subscriptions</button></div></section><section class="panel"><h2>Recently found</h2>${items('accounts')}</section>`}if(screen==='Accounts'){html=`<h1>Forgotten accounts</h1><p class="muted">These are sample findings, not verified live accounts.</p><section class="panel"><h2>Your account list</h2>${items('accounts')}</section><section class="panel"><h2>Add an account manually</h2><form id="accountForm" class="row"><input name="name" placeholder="Website or app name" required maxlength="80"><button class="primary">Add account</button></form></section>`}if(screen==='Subscriptions'){let total=data.subscriptions.filter(x=>x.status!=='Closed'&&x.cycle==='Monthly').reduce((sum,x)=>sum+Number(x.amount),0);html=`<h1>Subscriptions</h1><p class="muted">Track possible recurring charges. A status change here does not cancel a real service.</p><section class="panel"><div class="number">$${total.toFixed(2)} / month</div><p class="note">Sample monthly total of subscriptions not marked canceled.</p>${items('subscriptions')}</section><section class="panel"><h2>Add a subscription</h2><form id="subscriptionForm" class="formgrid"><input name="name" placeholder="Subscription name" required maxlength="80"><input name="amount" type="number" min="0" step="0.01" placeholder="Monthly amount ($)" required><button class="primary">Add subscription</button></form></section>`}if(screen==='Scan'){html=`<h1>Find forgotten accounts</h1><p class="muted">See how GhostCheck could work once email integrations are approved.</p><section class="panel"><h2>Connect your email</h2><p>Gmail, Outlook, and Yahoo connections are <strong>not active</strong> in this prototype. We will add secure permission-based sign-in later.</p><div class="row"><button class="secondary" data-action="unavailable">Connect Gmail</button><button class="secondary" data-action="unavailable">Connect Outlook</button><button class="secondary" data-action="unavailable">Connect Yahoo</button></div></section><section class="panel"><h2>Try a sample scan</h2><p class="muted">Adds one clearly labeled example finding. No email is read.</p><button class="primary" data-action="demo">Run demo scan</button></section>`}if(screen==='Settings'){html=`<h1>Privacy and settings</h1><section class="panel"><h2>Your privacy</h2><p>GhostCheck currently runs as a local demo. No accounts are connected and no mailbox data is sent to our servers.</p><p class="note">Your demo edits are saved in this browser's local storage so they stay when you refresh.</p><button class="danger" data-action="reset">Erase demo data and reset</button></section><section class="panel"><h2>Coming later</h2><p class="muted">Secure login, encrypted connection tokens, disconnect controls, and deletion of server-side findings.</p></section>`}$('content').innerHTML=html}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.screen){go(b.dataset.screen);return}let a=b.dataset.action;if(a==='status'){let x=data[b.dataset.type].find(x=>x.id===Number(b.dataset.id));if(x){x.status=b.dataset.status;save();render();notify('Updated demo status')}}if(a==='unavailable')notify('Not connected yet — demo only');if(a==='demo'){data.accounts.push({id:Date.now(),name:'Sample newsletter signup',source:'Demo scan result — not a real email',status:'Review'});save();go('Accounts');notify('Sample finding added')}if(a==='reset'){if(confirm('Erase all demo changes?')){data=structuredClone(defaults);save();render();notify('Demo reset')}}});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='accountForm'){let name=f.elements.name.value.trim();if(name)data.accounts.push({id:Date.now(),name,source:'Added manually',status:'Review'})}if(f.id==='subscriptionForm'){let name=f.elements.name.value.trim(),amount=Number(f.elements.amount.value);if(name&&Number.isFinite(amount)&&amount>=0)data.subscriptions.push({id:Date.now(),name,amount,cycle:'Monthly',status:'Review'})}save();render();notify('Added to your demo')});render();
</script></body></html>
