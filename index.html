<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GhostCheck — Digital Cleanup</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf2f8;background:#101827}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:12px;align-items:center;font-size:24px;font-weight:800}.logo{background:#b4eee1;color:#10232b;padding:10px;border-radius:14px}.muted{color:#a9bdcc}.layout{display:grid;grid-template-columns:205px 1fr;gap:22px;margin-top:26px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;text-align:left;border-radius:12px;padding:14px;background:transparent;color:#c5d5df}.nav button.active,.nav button:hover{background:#26394b;color:#b4eee1}.main{min-height:650px}.panel{background:#1d2a3d;border:1px solid #304357;border-radius:18px;padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#26394d;border-radius:14px;padding:16px}.number{font-size:29px;font-weight:800;color:#b4eee1}.primary{background:#b4eee1;color:#122c35;border:0;padding:11px 16px;border-radius:11px;font-weight:700}.secondary{background:#31455a;color:#eaf2f8;border:1px solid #4d6376;padding:10px 14px;border-radius:11px}.danger{background:#4b2e3b;color:#ffc8d0;border:1px solid #7b4755;padding:10px 14px;border-radius:11px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #34485a;padding:16px 0}.item:first-of-type{border-top:0}.item p{margin:5px 0 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;background:#314b55;border-radius:99px;font-size:12px;color:#b9eadd}input,select{background:#142235;border:1px solid #4b6072;color:#fff;border-radius:10px;padding:11px;max-width:100%}label{display:block;margin-bottom:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.note{font-size:13px;color:#b4c6d3}.toast{position:fixed;bottom:20px;right:20px;background:#b4eee1;color:#152b35;border-radius:12px;padding:12px 16px;box-shadow:0 8px 30px #0008;display:none}h1{margin:0 0 8px;font-size:28px}h2{margin-top:0}a{color:#b4eee1}@media(max-width:700px){.shell{padding:14px}.layout{display:block}.nav{flex-direction:row;overflow:auto;margin-bottom:18px}.nav button{white-space:nowrap;padding:10px}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.top .muted{display:none}}

.auth-wrap{max-width:480px;margin:55px auto}.auth-wrap input{width:100%;margin:6px 0 14px}.auth-wrap button{margin-right:8px}.top-actions{display:flex;align-items:center;gap:10px}.error{color:#ffc8d0}.success{color:#b4eee1}.config{border:1px solid #886a37;background:#3a3023;padding:14px;border-radius:12px}.item-actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px}.field{width:100%}

.alert{border-left:4px solid #b4eee1;padding:12px 15px;background:#243b48;border-radius:10px;margin:10px 0}.alert.urgent{border-color:#ffc27a}.progress{height:12px;border-radius:12px;background:#34485a;overflow:hidden}.progress>div{height:100%;background:#b4eee1}.subform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subform label{margin:0}.subform input,.subform select{width:100%;margin-top:6px}.full{grid-column:1/-1}.section-label{font-size:13px;color:#a9bdcc;margin-bottom:6px}.metric{font-size:24px;font-weight:750;color:#b4eee1}.warn{color:#ffd5a3}@media(max-width:700px){.subform{grid-template-columns:1fr}}
</style></head><body>
<div class="shell"><header class="top"><div class="brand"><span class="logo">👻</span> GhostCheck</div><div class="top-actions"><span class="muted" id="userEmail"></span><button class="secondary hidden" id="signOut">Sign out</button></div></header><div id="setup" class="panel hidden"></div><div id="auth" class="auth-wrap hidden"></div><div class="layout hidden" id="app"><nav class="nav" id="nav"></nav><main class="main" id="content"></main></div><p class="note">GhostCheck stores manually entered account and subscription records. Email scanning and automatic cancellation are not available.</p></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// ONLY public Supabase values belong here. NEVER use a secret or service_role key.
const SUPABASE_URL = 'https://gvkmvjbtxtxuqgdausqh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KRwXjFOkr719WCRksmxGVw_dd2PNKDL';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const configured=SUPABASE_URL.startsWith('https://') && SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_') || SUPABASE_URL.startsWith('https://') && SUPABASE_PUBLISHABLE_KEY.startsWith('eyJ');
let client=null,user=null,screen='Dashboard',accounts=[],subscriptions=[];
const screens=['Dashboard','Accounts','Subscriptions','Scan','Settings'];
const todayISO=()=>new Date().toLocaleDateString('en-CA');
function daysUntil(iso){if(!iso)return null;const today=new Date();today.setHours(0,0,0,0);const [y,m,d]=iso.split('-').map(Number);return Math.round((new Date(y,m-1,d)-today)/86400000)}
function reminderItems(){return subscriptions.filter(x=>x.status!=='cancelled'&&x.reminder_enabled!==false).flatMap(x=>{let out=[];if(x.renewal_date){let n=daysUntil(x.renewal_date);if(n!==null&&n>=0&&n<=7)out.push({name:x.service_name,days:n,type:'Renewal',date:x.renewal_date})}if(x.is_free_trial&&x.trial_end_date){let n=daysUntil(x.trial_end_date);if(n!==null&&n>=0&&n<=7)out.push({name:x.service_name,days:n,type:'Trial ends',date:x.trial_end_date})}return out}).sort((a,b)=>a.days-b.days)}
function alertsHTML(){let items=reminderItems();return items.length?items.map(x=>`<div class="alert ${x.days<=2?'urgent':''}"><strong>${esc(x.name)}</strong> — ${esc(x.type)} ${x.days===0?'today':`in ${x.days} day${x.days===1?'':'s'}`} <span class="muted">(${esc(x.date)})</span></div>`).join(''):'<p class="muted">No renewals or trials due in the next 7 days.</p>'}

function notify(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function errorText(err){return err?.message||'Something went wrong.'}
function authView(message=''){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('userEmail').textContent='';$('signOut').classList.add('hidden');$('auth').innerHTML=`<section class="panel"><h1>Welcome to GhostCheck</h1><p class="muted">Sign in or create an account to save your digital cleanup list.</p>${message?`<p class="error">${esc(message)}</p>`:''}<form id="authForm"><label>Email<input class="field" name="email" type="email" autocomplete="email" required></label><label>Password<input class="field" name="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="row"><button class="primary" name="intent" value="signin">Sign in</button><button class="secondary" name="intent" value="signup">Create account</button></div></form><p class="note">A confirmation email may be required before your first sign-in.</p></section>`}
function nav(){ $('nav').innerHTML=screens.map(s=>`<button class="${s===screen?'active':''}" data-screen="${s}">${s}</button>`).join('')}
function accountRow(x){return `<div class="item"><div><strong>${esc(x.website_name)}</strong> <span class="pill">${esc(x.status)}</span><p class="muted">${esc(x.website_url||x.email_address||'Added manually')}</p></div><div class="item-actions"><button class="secondary" data-kind="account" data-id="${x.id}" data-status="keep">Keep</button><button class="secondary" data-kind="account" data-id="${x.id}" data-status="review">Review</button><button class="danger" data-kind="account" data-id="${x.id}" data-status="closed">Closed</button><button class="danger" data-delete="account" data-id="${x.id}">Delete</button></div></div>`}
function subRow(x){return `<div class="item"><div><strong>${esc(x.service_name)}</strong> <span class="pill">${esc(x.status)}</span><p class="muted">$${Number(x.monthly_cost).toFixed(2)} / month${x.renewal_date?' · Renewal: '+esc(x.renewal_date):''}${x.is_free_trial?' · Free trial until '+esc(x.trial_end_date||'date not set'):''}${x.reminder_enabled===false?' · Reminders off':''}</p></div><div class="item-actions"><button class="secondary" data-kind="subscription" data-id="${x.id}" data-status="active">Active</button><button class="secondary" data-kind="subscription" data-id="${x.id}" data-status="review">Review</button><button class="danger" data-kind="subscription" data-id="${x.id}" data-status="cancelled">Mark canceled</button><button class="secondary" data-edit="subscription" data-id="${x.id}">Edit</button><button class="danger" data-delete="subscription" data-id="${x.id}">Delete</button></div></div>`}
function render(){nav();let html='';if(screen==='Dashboard'){let needs=accounts.filter(x=>x.status==='review').length+subscriptions.filter(x=>x.status==='review').length;let total=accounts.length+subscriptions.length;let completed=accounts.filter(x=>x.status==='closed').length+subscriptions.filter(x=>x.status==='cancelled').length;let monthly=subscriptions.filter(x=>x.status!=='cancelled').reduce((sum,x)=>sum+Number(x.monthly_cost||0),0);html=`<h1>Your digital cleanup</h1><p class="muted">Your private saved records.</p><section class="panel"><div class="stats"><div class="stat"><div class="number">${accounts.length}</div><small>Accounts</small></div><div class="stat"><div class="number">${subscriptions.filter(x=>x.status!=='cancelled').length}</div><small>Subscriptions</small></div><div class="stat"><div class="number">${needs}</div><small>Need review</small></div></div></section><section class="panel"><h2>Upcoming renewals & trials</h2>${alertsHTML()}</section><section class="panel"><h2>Spending and cleanup</h2><div class="stats"><div class="stat"><div class="metric">$${monthly.toFixed(2)}</div><small>Estimated monthly spend</small></div><div class="stat"><div class="metric">$${(monthly*12).toFixed(2)}</div><small>Estimated yearly spend</small></div><div class="stat"><div class="metric">${total?Math.round(completed/total*100):0}%</div><small>Marked closed/canceled</small></div></div><p class="note">Cleanup progress counts statuses you set, not verified account closures or service cancellations.</p><div class="progress"><div style="width:${total?Math.round(completed/total*100):0}%"></div></div></section><section class="panel"><h2>Quick actions</h2><div class="row"><button class="primary" data-screen="Accounts">Add an account</button><button class="secondary" data-screen="Subscriptions">Track subscriptions</button></div></section><section class="panel"><h2>Recently added accounts</h2>${accounts.slice(0,5).map(accountRow).join('')||'<p class="muted">No accounts yet.</p>'}</section>`}
if(screen==='Accounts')html=`<h1>Forgotten accounts</h1><p class="muted">Manually track accounts you want to review or close.</p><section class="panel"><h2>Your account list</h2>${accounts.map(accountRow).join('')||'<p class="muted">Nothing here yet.</p>'}</section><section class="panel"><h2>Add an account</h2><form id="accountForm" class="formgrid"><input name="name" placeholder="Website or app name" maxlength="80" required><input name="url" type="url" placeholder="Website URL (optional)"><input name="email" type="email" placeholder="Account email (optional)"><button class="primary">Save account</button></form></section>`;
if(screen==='Subscriptions'){let total=subscriptions.filter(x=>x.status!=='cancelled').reduce((a,x)=>a+Number(x.monthly_cost),0);html=`<h1>Subscriptions</h1><p class="muted">Track costs manually. Marking a service canceled does not cancel it with the provider.</p><section class="panel"><div class="number">$${total.toFixed(2)} / month</div><p class="note">Monthly estimate based on saved subscriptions not marked canceled.</p><h2>Upcoming reminders</h2>${alertsHTML()}</section><section class="panel"><h2>Your subscriptions</h2>${subscriptions.map(subRow).join('')||'<p class="muted">No subscriptions yet.</p>'}</section><section class="panel"><h2 id="subFormTitle">Add a subscription</h2><form id="subForm" class="subform"><label>Service name<input name="name" maxlength="80" required></label><label>Monthly cost ($)<input name="amount" type="number" min="0" max="99999999" step="0.01" required></label><label>Next renewal<input name="renewal" type="date"></label><label>Trial end date<input name="trialEnd" type="date"></label><label><input name="trial" type="checkbox"> Free trial</label><label><input name="reminder" type="checkbox" checked> Show renewal reminders</label><div class="full row"><button class="primary" id="subSave">Save subscription</button><button class="secondary hidden" type="button" id="cancelEdit">Cancel edit</button></div><input type="hidden" name="editId"></form><p class="note">Reminders appear inside GhostCheck when you visit. They are not emails or push notifications.</p></section>`}
if(screen==='Scan')html=`<h1>Find forgotten accounts</h1><section class="panel"><h2>Email scanning is not active</h2><p class="muted">GhostCheck does not access Gmail, Outlook or Yahoo. Email integrations will require additional setup and user permission.</p><p>You can add accounts and subscriptions manually in their tabs.</p><p class="note">Gmail and Outlook OAuth access and inbox scanning are not configured. Never enter your email password into GhostCheck.</p></section>`;
if(screen==='Settings')html=`<h1>Privacy and settings</h1><section class="panel"><h2>Your account</h2><p>${esc(user.email)}</p><p class="muted">Your saved records are stored in Supabase with per-user database access rules.</p><button class="danger" id="deleteRecords">Delete all my saved records</button><button class="secondary" id="exportRecords">Download my records (JSON)</button><p class="note">This deletes your account and subscription entries, not your login. Deleting your login account requires a secure server-side account deletion process. Contact the site operator until that feature is configured.</p></section>`;
$('content').innerHTML=html}
async function load(){const [a,b]=await Promise.all([client.from('forgotten_accounts').select('*').order('created_at',{ascending:false}),client.from('subscriptions').select('*').order('created_at',{ascending:false})]);if(a.error||b.error)throw a.error||b.error;accounts=a.data||[];subscriptions=b.data||[];render()}
async function showApp(){if(!user){authView();return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=user.email||'';$('signOut').classList.remove('hidden');try{await load()}catch(err){$('content').innerHTML=`<section class="panel"><h2>Unable to load your data</h2><p class="error">${esc(errorText(err))}</p></section>`}}
if(!configured){$('setup').classList.remove('hidden');$('setup').innerHTML='<h2>Supabase setup needed</h2><p>Open index.html and replace the two PASTE_YOUR... values near the beginning of the script with your GhostCheck Project URL and public Publishable Key, then upload the updated file to GitHub.</p>'}else{try{client=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const {data,error}=await client.auth.getUser();if(error && error.name!=='AuthSessionMissingError')console.warn('Auth:',error.message);user=data?.user||null;if(user)await showApp();else authView();client.auth.onAuthStateChange((_event,session)=>{const next=session?.user||null;if(next?.id!==user?.id){user=next;if(user)showApp();else authView()}})}catch(err){$('setup').classList.remove('hidden');$('setup').textContent='Connection problem: '+errorText(err)}}
$('signOut').addEventListener('click',async()=>{if(client){const {error}=await client.auth.signOut();if(error)notify(errorText(error));else{user=null;accounts=[];subscriptions=[];authView()}}});
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b||!user||!client)return;if(b.dataset.screen){screen=b.dataset.screen;render();return}try{if(b.dataset.edit==='subscription'){const x=subscriptions.find(x=>x.id===b.dataset.id);if(!x)return;screen='Subscriptions';render();const f=$('subForm');f.elements.editId.value=x.id;f.elements.name.value=x.service_name;f.elements.amount.value=x.monthly_cost;f.elements.renewal.value=x.renewal_date||'';f.elements.trialEnd.value=x.trial_end_date||'';f.elements.trial.checked=!!x.is_free_trial;f.elements.reminder.checked=x.reminder_enabled!==false;$('subFormTitle').textContent='Edit subscription';$('subSave').textContent='Update subscription';$('cancelEdit').classList.remove('hidden');f.scrollIntoView({behavior:'smooth'});return}if(b.id==='cancelEdit'){render();return}if(b.id==='exportRecords'){const blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),accounts,subscriptions},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ghostcheck-my-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(b.id==='passwordReset'){if(!user.email)throw Error('No email on account');const {error}=await client.auth.resetPasswordForEmail(user.email,{redirectTo:location.origin+location.pathname});if(error)throw error;notify('Password reset email requested. Check your inbox.');return}if(b.dataset.kind){const table=b.dataset.kind==='account'?'forgotten_accounts':'subscriptions';const {error}=await client.from(table).update({status:b.dataset.status}).eq('id',b.dataset.id).eq('user_id',user.id);if(error)throw error;await load();notify('Status saved')}else if(b.dataset.delete){if(!confirm('Delete this saved record?'))return;const table=b.dataset.delete==='account'?'forgotten_accounts':'subscriptions';const {error}=await client.from(table).delete().eq('id',b.dataset.id).eq('user_id',user.id);if(error)throw error;await load();notify('Record deleted')}else if(b.id==='deleteRecords'){if(!confirm('Permanently delete all your saved accounts and subscriptions?'))return;const a=await client.from('forgotten_accounts').delete().eq('user_id',user.id);if(a.error)throw a.error;const s=await client.from('subscriptions').delete().eq('user_id',user.id);if(s.error)throw s.error;await load();notify('Saved records deleted')}}catch(err){notify(errorText(err))}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['authForm','accountForm','subForm'].includes(f.id))return;e.preventDefault();const btn=e.submitter;try{if(f.id==='authForm'){const email=f.elements.email.value.trim(),password=f.elements.password.value;const signup=btn?.value==='signup';const res=signup?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});if(res.error)throw res.error;if(signup&&!res.data.session){authView();notify('Check your email for a confirmation link.')}else{user=res.data.user;await showApp();notify(signup?'Account created':'Signed in')}return}if(!user)return;btn.disabled=true;if(f.id==='accountForm'){const payload={user_id:user.id,website_name:f.elements.name.value.trim(),website_url:f.elements.url.value.trim()||null,email_address:f.elements.email.value.trim()||null,status:'review'};const {error}=await client.from('forgotten_accounts').insert(payload);if(error)throw error}else{const amount=Number(f.elements.amount.value);if(!Number.isFinite(amount)||amount<0)throw Error('Invalid amount');const payload={user_id:user.id,service_name:f.elements.name.value.trim(),monthly_cost:amount,renewal_date:f.elements.renewal.value||null,is_free_trial:f.elements.trial.checked,trial_end_date:f.elements.trialEnd.value||null,reminder_enabled:f.elements.reminder.checked};const editId=f.elements.editId.value;const {error}=editId?await client.from('subscriptions').update(payload).eq('id',editId).eq('user_id',user.id):await client.from('subscriptions').insert({...payload,status:'review'});if(error)throw error}await load();notify('Saved to Supabase')}catch(err){notify(errorText(err))}finally{if(btn?.isConnected)btn.disabled=false}});
</script></body></html>
